# Configurazione di pgBackRest dell'immagine PostgreSQL (08 §pgBackRest; note del piano di OPS-T01a, «Configurazione»):
# solo le opzioni uguali su tutti i server. Endpoint, bucket, regione, chiave, segreto e repo1-cipher-pass pgBackRest
# li legge dalle variabili PGBACKREST_* di postgres.env, che vincono su questo file: qui non c'è nessun segreto.
# Un ripristino con un file scritto a mano (OPS-004, OPS-046) ripete repo1-type, repo1-path e repo1-cipher-type, e
# pg1-path nella sezione [main].

[global]
# Archivio S3 cifrato; le chiavi del bucket stanno sotto /pgbackrest.
repo1-type=s3
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
# Conservazione a tempo (OPS-002): restano l'ultimo backup completo più vecchio di 30 giorni e tutti i successivi,
# con i loro differenziali e i WAL (esito del [VERIFICA] di 08 §pgBackRest).
repo1-retention-full-type=time
repo1-retention-full=30
# Il backup parte subito, con un checkpoint, invece di aspettare il prossimo.
start-fast=y
# Nessun file di log: nel container non ruoterebbe mai (FON-010). I messaggi vanno nei log di Docker, a rotazione.
log-level-file=off

[main]
# Opzione della sola stanza (in [global] pgBackRest la ignora): la cartella dei dati dell'immagine 18, cioè PGDATA.
pg1-path=/var/lib/postgresql/18/docker
