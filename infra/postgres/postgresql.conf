# Configurazione di PostgreSQL del progetto (01 §Servizi, FON-T03), passata con -c config_file=… (Dockerfile).
# Con un file proprio non vale più quello generato da initdb nella cartella dei dati: ciò che non è scritto qui
# prende il valore predefinito di PostgreSQL. pg_hba.conf resta quello della cartella dei dati.

# In ascolto su tutte le interfacce del container: la rete la limitano Compose (internal sui server) e, in
# sviluppo, la porta pubblicata solo su 127.0.0.1.
listen_addresses = '*'

# Orari in UTC, nel database e nei log.
timezone = 'UTC'
log_timezone = 'UTC'

# Archiviazione continua dei WAL con pgBackRest verso il bucket dei backup (08 §pgBackRest, OPS-001; OPS-T01a): un
# segmento al più ogni 60 secondi anche con poco traffico. Prima che pgbackrest-init crei la stanza i tentativi
# falliscono e PostgreSQL li ripete. In sviluppo e in CI compose.dev.yml la spegne (archive_mode=off): là non c'è la
# stanza, e i WAL non archiviati si accumulerebbero.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 60
