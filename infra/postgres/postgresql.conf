# Configurazione di PostgreSQL del progetto (01 §Servizi, FON-T03), passata con -c config_file=… (Dockerfile).
# Con un file proprio non vale più quello generato da initdb nella cartella dei dati: ciò che non è scritto qui
# prende il valore predefinito di PostgreSQL. pg_hba.conf resta quello della cartella dei dati.
# Solo le impostazioni di base: l'archiviazione dei WAL con pgBackRest (08 §pgBackRest) la aggiunge OPS-T01a.

# In ascolto su tutte le interfacce del container: la rete la limitano Compose (internal sui server) e, in
# sviluppo, la porta pubblicata solo su 127.0.0.1.
listen_addresses = '*'

# Orari in UTC, nel database e nei log.
timezone = 'UTC'
log_timezone = 'UTC'
