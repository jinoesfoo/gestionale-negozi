# Configurazione Compose dei server, base comune a test e produzione (01 §Servizi Docker Compose, FON-T06).
#
# Sui server si usa sempre attraverso /srv/app/dc (infra/scripts/dc), che aggiunge il file dell'ambiente
# (compose.test.yml o compose.prod.yml) e imposta il progetto `app`, la cartella /srv/app e /srv/app/.env, da cui
# Compose legge APP_TAG, CADDY_TAG e POSTGRES_TAG (scritti da deploy.sh; prima di FON-T08 a mano, DOM-T02). Sono
# obbligatori tutti e tre (`${X_TAG:?…}`): se uno manca o è vuoto, ogni comando di /srv/app/dc si ferma subito con un
# messaggio che lo nomina, anche per un servizio che non usa quell'immagine. I percorsi relativi partono dalla cartella
# del progetto, /srv/app: ./infra/… è la cartella infra/ del commit rilasciato.
#
# Ogni servizio ha il suo file di ambiente in /srv/app/env/, che scrive l'utente; ENV_DIR serve solo a
# infra/check-ports.sh, che usa gli esempi di infra/env.example/. Finché un servizio non ha il suo file vero, il
# file c'è ma è vuoto (lo scrive l'utente in DOM-T02): con Compose v5.7.1, la versione dei server, `up` e `run`
# controllano solo i file dei servizi scelti, ma i file vuoti servono con ogni versione di Compose (06, DOM-T02,
# esito del [VERIFICA] su env_file).
#
# Solo caddy pubblica porte, 80 e 443 solo TCP (FON-008); app, worker e PostgreSQL stanno sulla rete internal, una
# rete bridge normale (non `internal: true`: devono raggiungere Stripe, l'email, l'archivio S3 e gli altri servizi
# esterni). Ogni servizio ruota i log (FON-010). Lo controlla infra/check-ports.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# L'immagine di postgres, che pgbackrest-init usa uguale (01 §Servizi): una riga sola, presa dai due servizi con
# `<<: *postgres-image`, perché il test di FON-002 (tests/unit/infra/compose-file.test.ts) conta cinque righe image:
# (08, note del piano di OPS-T01a, «infra/compose.yml»). Chi aggiunge un'altra riga image: aggiorna quel test con joo.
x-postgres-image: &postgres-image
  image: ghcr.io/jinoesfoo/gestionale-negozi-postgres:${POSTGRES_TAG:?manca POSTGRES_TAG in /srv/app/.env}

services:
  caddy:
    image: ghcr.io/jinoesfoo/gestionale-negozi-caddy:${CADDY_TAG:?manca CADDY_TAG in /srv/app/.env}
    # Nessun depends_on: nel bootstrap di DOM-T02 caddy si avvia da solo.
    env_file: ${ENV_DIR:-/srv/app/env}/caddy.env
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    networks: [edge, internal]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

  app:
    image: ghcr.io/jinoesfoo/gestionale-negozi-app:${APP_TAG:?manca APP_TAG in /srv/app/.env}
    command: ['node', 'server.js']
    env_file: ${ENV_DIR:-/srv/app/env}/app.env
    networks: [internal]
    # pgbackrest-init: con il file indicatore l'attesa dura pochi secondi e non dipende dal bucket (01 §Servizi).
    depends_on:
      postgres:
        condition: service_healthy
      pgbackrest-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  worker:
    image: ghcr.io/jinoesfoo/gestionale-negozi-app:${APP_TAG:?manca APP_TAG in /srv/app/.env}
    command: ['node', 'dist/worker.js']
    env_file: ${ENV_DIR:-/srv/app/env}/worker.env
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      pgbackrest-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Una tantum: `/srv/app/dc run --rm migrate` (migrazioni) e `/srv/app/dc run --rm migrate node dist/cli.js
  # <comando>` (CLI). Nel profilo tools, così `up -d` non lo avvia. L'unico servizio con DATABASE_OWNER_URL.
  migrate:
    image: ghcr.io/jinoesfoo/gestionale-negozi-app:${APP_TAG:?manca APP_TAG in /srv/app/.env}
    command: ['node', 'dist/migrate.js']
    env_file: ${ENV_DIR:-/srv/app/env}/migrate.env
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]
    restart: 'no'
    logging: *logging

  # Archivia i WAL con pgBackRest (08 §pgBackRest): le variabili PGBACKREST_* di postgres.env le legge pgBackRest.
  # Il socket sta nel volume pgsocket, che pgbackrest-init condivide.
  postgres:
    <<: *postgres-image
    env_file: ${ENV_DIR:-/srv/app/env}/postgres.env
    networks: [internal]
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    logging: *logging

  # Una tantum, dopo postgres in salute (01 §Servizi; 08 §pgBackRest, «Primo avvio»): con il file indicatore
  # /var/lib/postgresql/.pgbackrest-stanza-ok sul volume pgdata termina subito, senza chiamare il bucket; altrimenti crea
  # la stanza se manca, esegue `pgbackrest check` e scrive il file. app e worker la aspettano; migrate no. Senza host
  # remoto pgBackRest ha bisogno dei file dei dati e del socket di PostgreSQL: gli stessi volumi pgdata e pgsocket di
  # postgres, allo stesso percorso. Il controllo di salute dell'immagine è quello di PostgreSQL, che qui non gira.
  pgbackrest-init:
    <<: *postgres-image
    command: ['pgbackrest-init']
    user: postgres
    env_file: ${ENV_DIR:-/srv/app/env}/postgres.env
    networks: [internal]
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      disable: true
    logging: *logging

networks:
  edge:
    # IPv6 (06 §DNS, DOM-T02). Con una rete solo IPv4 Docker inoltra le connessioni IPv6 con docker-proxy, e Caddy vedrebbe
    # l'indirizzo del gateway, uguale per tutti i client IPv6; con IPv6 sulla rete fa solo NAT di destinazione, e a Caddy
    # arriva l'indirizzo vero. La sottorete (ULA, /64) la sceglie Docker. Creando la rete Docker accende l'inoltro IPv6:
    # sull'host rotta e indirizzo IPv6 devono essere statici (infra/README.md, «Caddy e certificati», DOM-T02).
    enable_ipv6: true
  internal:

volumes:
  pgdata:
  pgsocket:
  caddy_data:
  caddy_config:
